  GNU nano 8.7.1                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           /etc/nginx/sites-available/telemed.smartcardio.ru
#  certbot и переходите на 443 (см. блок в конце файла).
#
#  Медиа-трафик WebRTC (порт 13478 UDP+TCP) НЕ идёт через nginx:
#      sudo ufw allow 13478/udp
#      sudo ufw allow 13478/tcp
#  и укажите публичный IP сервера в MEDIASOUP_ANNOUNCED_IP.
#
#  Установка:
#      sudo cp nginx/telemed.smartcardio.ru.conf \
#              /etc/nginx/sites-available/telemed.smartcardio.ru
#      sudo ln -s /etc/nginx/sites-available/telemed.smartcardio.ru \
#                 /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# ---------------------------------------------------------------------------
# Апгрейд соединения до WebSocket.
# Блок map должен быть в http-контексте — sites-enabled/ подключается внутри
# http, поэтому здесь он корректен. Если блок уже объявлен в другом файле —
# удалите его отсюда, иначе nginx выдаст "duplicate map".
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Апстримы. keepalive заметно снижает задержку на polling-запросах Socket.IO.
# ---------------------------------------------------------------------------
upstream telemed_next {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream telemed_socket {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream telemed_mediasoup {
    server 127.0.0.1:3002 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Основной сервер — HTTP :80
# ---------------------------------------------------------------------------
server {
    server_name telemed.smartcardio.ru;

    # --- Заголовки безопасности -------------------------------------------
    # Strict-Transport-Security намеренно НЕ добавлен: на HTTP он бы
    # заставил браузер запомнить редирект на https и сайт стал бы
    # недоступен до установки сертификата.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    # Камера/микрофон/шаринг экрана нужны видеозвонкам — разрешаем только себе.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;

    # --- Лимиты и таймауты -------------------------------------------------
    # 100mb в next.config (serverActions.bodySizeLimit) + запись звонков,
    # поэтому запас по размеру тела запроса.
    client_max_body_size    200m;
    client_body_timeout     300s;
    client_body_buffer_size 1m;
    send_timeout            300s;

    # --- Сжатие ------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied    any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    # --- ACME-челлендж заранее: понадобится для certbot --------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # =======================================================================
    #  Socket.IO — чат и сигналинг (порт 3001)
    #  Клиент: NEXT_PUBLIC_SOCKET_URL=http://telemed.smartcardio.ru
    #          NEXT_PUBLIC_SOCKET_PATH=/socket.io
    # =======================================================================
    location /socket.io/ {
        proxy_pass http://telemed_socket;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;

        # Долгоживущие соединения: не рвём сокет по таймауту чтения.
        proxy_read_timeout    7d;
        proxy_send_timeout    7d;
        proxy_connect_timeout 10s;

        # Буферизация ломает long-polling и задерживает события.
        proxy_buffering off;
        proxy_cache     off;
    }

    # =======================================================================
    #  MediaSoup SFU — сигналинг видеозвонков (порт 3002)
    #  Сервер слушает на дефолтном пути /socket.io/, а клиент обращается по
    #  /mediasoup (NEXT_PUBLIC_MEDIASOUP_PATH), поэтому префикс подменяем:
    #  /mediasoup/... -> /socket.io/...  (важны обе завершающие косые черты)
    # =======================================================================
    location /mediasoup/ {
        proxy_pass http://telemed_mediasoup/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;

        proxy_read_timeout    7d;
        proxy_send_timeout    7d;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_cache     off;
    }

    # Обращение без завершающего слеша.
    location = /mediasoup {
        return 301 /mediasoup/;
    }

    # =======================================================================
    #  PeerJS (legacy-режим звонков, NEXT_PUBLIC_USE_MEDIASOUP=false)
    #  Порт 3002 по умолчанию занят MediaSoup, поэтому при одновременной
    #  работе запускайте peer-сервер с PEER_PORT=3003 и раскомментируйте блок.
    # =======================================================================
    # location /peerjs/ {
    #     proxy_pass http://127.0.0.1:3003;
    #
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     proxy_read_timeout 7d;
    #     proxy_send_timeout 7d;
    #     proxy_buffering off;
    # }

    # =======================================================================
    #  Health-check эндпоинты бэкендов — только из локальной сети.
    # =======================================================================
    location = /health/socket {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://telemed_socket/health;
        proxy_set_header Host $host;
    }

    location = /health/mediasoup {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://telemed_mediasoup/health;
        proxy_set_header Host $host;
    }

    # =======================================================================
    #  Статика Next.js — иммутабельные ассеты с хешем в имени.
    # =======================================================================
    location /_next/static/ {
        proxy_pass http://telemed_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Видео/изображения из public/ — отдаём с длинным кешем.
    location ~* ^/(video|images)/ {
        proxy_pass http://telemed_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # =======================================================================
    #  Медиафайлы Payload (staticDir: 'media') и записи звонков.
    #  Отдаёт Payload, но тела могут быть большими — увеличенные таймауты.
    #
    #  ВАЖНО: регулярка, а не `location /api/media/`.
    #  Загрузка идёт POST-ом на /api/media — БЕЗ завершающего слеша, поэтому
    #  префикс `/api/media/` его НЕ ловил, запрос попадал в `location /`
    #  с `Connection $connection_upgrade` и коротким proxy_read_timeout,
    #  и multipart-загрузка обрывалась → в браузере "Failed to fetch".
    # =======================================================================
    location ~ ^/api/media(/|$) {
        proxy_pass http://telemed_next;
        proxy_http_version 1.1;
        # Апстрим — обычный HTTP, апгрейд здесь не нужен и мешает.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # =======================================================================
    #  Next.js + Payload admin + API — всё остальное.
    # =======================================================================
    location / {
        proxy_pass http://telemed_next;

        proxy_http_version 1.1;
        # HMR/Server Actions/streaming RSC требуют апгрейда и отсутствия буфера.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Streaming RSC ломается при буферизации ответа.
        proxy_buffering off;
        proxy_redirect  off;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/telemed.smartcardio.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/telemed.smartcardio.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ============================================================================
#  ПЕРЕХОД НА HTTPS (когда домен заработает)
# ----------------------------------------------------------------------------
#  1) sudo mkdir -p /var/www/certbot
#  2) sudo certbot certonly --webroot -w /var/www/certbot \
#          -d telemed.smartcardio.ru
#  3) В блоке server выше замените
#         listen 80;  listen [::]:80;
#     на
#         listen 443 ssl;  listen [::]:443 ssl;  http2 on;
#         ssl_certificate     /etc/letsencrypt/live/telemed.smartcardio.ru/fullchain.pem;
#         ssl_certificate_key /etc/letsencrypt/live/telemed.smartcardio.ru/privkey.pem;
#         ssl_protocols       TLSv1.2 TLSv1.3;
#         ssl_session_cache   shared:SSL:10m;
#         ssl_session_timeout 1d;
#     и верните заголовок:
#         add_header Strict-Transport-Security "max-age=63072000" always;
#  4) Добавьте редирект с 80 на 443:
#         server {
#             listen 80;
#             listen [::]:80;
#             server_name telemed.smartcardio.ru;
#             location /.well-known/acme-challenge/ { root /var/www/certbot; }
#             location / { return 301 https://telemed.smartcardio.ru$request_uri; }
#         }
#  5) В .env замените http:// на https:// в SERVER_URL,
#     NEXT_PUBLIC_SOCKET_URL, NEXT_PUBLIC_MEDIASOUP_URL,
#     SOCKET_ALLOWED_ORIGINS, MEDIASOUP_CORS_ORIGINS
#     и пересоберите приложение (pnpm build), т.к. NEXT_PUBLIC_*
#     вшиваются в бандл на этапе сборки.
# ============================================================================

server {
    if ($host = telemed.smartcardio.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name telemed.smartcardio.ru;
    return 404; # managed by Certbot


}

